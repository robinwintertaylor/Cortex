<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cortex — dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --dim:#8b93a5; --accent:#7aa2f7; --ok:#9ece6a; --warn:#e0af68; --bad:#f7768e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-monospace, "SF Mono", Menlo, monospace; background:var(--bg); color:var(--text); font-size:14px; }
  header { display:flex; gap:18px; align-items:center; padding:12px 22px; background:var(--panel); border-bottom:1px solid #262b36; }
  header h1 { font-size:15px; margin:0; color:var(--accent); }
  header nav a { color:var(--dim); text-decoration:none; margin-right:14px; }
  header nav a:hover, header nav a.active { color:var(--text); }
  main { padding:20px 22px; max-width:1100px; }
  .card { background:var(--panel); border:1px solid #262b36; border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .dim { color:var(--dim); }
  .tag { display:inline-block; background:#20242e; border-radius:4px; padding:1px 6px; margin-right:4px; font-size:12px; color:var(--accent); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  form.inline * { margin-right:6px; }
  input, select { background:#20242e; color:var(--text); border:1px solid #2c3340; border-radius:5px; padding:6px 8px; font-family:inherit; }
  input[type=text].wide { width:60%; }
  button { background:#2c3340; color:var(--text); border:none; border-radius:5px; padding:6px 12px; cursor:pointer; font-family:inherit; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid #232833; vertical-align:top; }
  .score { color:var(--dim); font-size:12px; }
  pre.digest { white-space:pre-wrap; background:#12151b; padding:12px; border-radius:6px; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <h1>🧠 CORTEX</h1>
  <nav>
    <a href="/">Timeline</a>
    <a href="/search">Search</a>
    <a href="/decisions">Decisions</a>
    <a href="/graph">Graph</a>
    <a href="/queue">Queue &amp; Digest</a>
    <a href="/agents">Agents</a>
  </nav>
  <span class="dim" style="margin-left:auto">read-only v1</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
