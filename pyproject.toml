[project]
name = "cortex"
version = "1.0.0"
description = "Cortex — self-hosted shared second-brain memory service for AI agent harnesses"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "fastembed>=0.3",
    "trafilatura>=1.8",
    "prometheus-client>=0.20",
    "mcp>=1.2",  # SDK v1 and v2 both supported (see cortex/api/mcp.py)
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
cortex = "cortex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cortex", "cortex.api", "cortex.librarian"]

[tool.setuptools.package-data]
cortex = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
